services:
  php:
    image: ${IMAGE}:${IMAGE_TAG}
    networks:
      - caddy_public
      - internal
    volumes:
      - runtime:/app/runtime
    env_file:
      - ./prod/.env
      - ./prod/override.env
    deploy:
      replicas: 2
      update_config:
        delay: 10s
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 10s
      rollback_config:
        parallelism: 0
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      labels:
        caddy: ${PROD_HOST:-app.example.com}
        caddy.reverse_proxy: "{{upstreams 80}}"
        caddy.reverse_proxy.lb_policy: cookie

  worker:
    image: ${IMAGE}:${IMAGE_TAG}
    working_dir: /app
    # Без RR: в Swarm entrypoint rr + user www-data давал early termination.
    # Тот же entrypoint, что у php (chown runtime → runuser www-data).
    command: ["php", "./yii", "queue/consume", "--sleep=1"]
    networks:
      - internal
    volumes:
      - runtime:/app/runtime
    env_file:
      - ./prod/.env
      - ./prod/override.env
    deploy:
      replicas: 2
      update_config:
        delay: 10s
        parallelism: 1
        order: start-first
        failure_action: pause
        monitor: 30s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: botato
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # На ноде с задачей: порт 5432 в режиме host (доступ с ПК через SSH-туннель).
    # host_ip в stack deploy не поддерживается — ограничьте доступ файрволом при необходимости.
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d botato"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  runtime:
  postgres_data:
  redis_data:

networks:
  caddy_public:
    external: true
  internal:
    driver: overlay
    attachable: true
