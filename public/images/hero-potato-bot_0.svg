<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="potato-body" x1="120" y1="80" x2="360" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8C98A"/>
      <stop offset="1" stop-color="#B8894A"/>
    </linearGradient>
    <linearGradient id="bot-metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="eye-glow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Sprout -->
    <path d="M228 58C228 58 236 24 260 18C284 12 292 38 278 52C264 66 248 72 228 58Z" fill="#65A30D"/>
    <path d="M252 54C252 54 268 28 292 34C316 40 308 66 290 68C272 70 252 54 252 54Z" fill="#84CC16"/>

    <!-- Antenna -->
    <rect x="232" y="78" width="16" height="34" rx="8" fill="#94A3B8"/>
    <circle cx="240" cy="68" r="14" fill="url(#bot-metal)"/>
    <circle cx="240" cy="68" r="6" fill="#C4B5FD"/>

    <!-- Body -->
    <path d="M96 170C96 102 154 56 240 56C326 56 384 102 384 170C384 238 384 318 384 360C384 430 322 468 240 468C158 468 96 430 96 360C96 318 96 238 96 170Z" fill="url(#potato-body)"/>
    <path d="M132 198C148 156 188 128 240 128C292 128 332 156 348 198" stroke="#A67C3D" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
    <ellipse cx="168" cy="250" rx="18" ry="12" fill="#A67C3D" opacity="0.18"/>
    <ellipse cx="312" cy="286" rx="22" ry="14" fill="#A67C3D" opacity="0.16"/>
    <ellipse cx="204" cy="360" rx="16" ry="10" fill="#A67C3D" opacity="0.14"/>

    <!-- Face panel -->
    <rect x="148" y="176" width="184" height="118" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
    <rect x="164" y="192" width="152" height="86" rx="20" fill="#0F172A"/>

    <!-- Eyes -->
    <circle cx="198" cy="236" r="22" fill="url(#eye-glow)"/>
    <circle cx="282" cy="236" r="22" fill="url(#eye-glow)"/>
    <circle cx="206" cy="228" r="7" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="290" cy="228" r="7" fill="#FFFFFF" opacity="0.85"/>

    <!-- Smile -->
    <path d="M188 272C210 292 270 292 292 272" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>

    <!-- Chest badge -->
    <circle cx="240" cy="334" r="34" fill="url(#bot-metal)"/>
    <text x="240" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">B</text>

    <!-- Arms -->
    <path d="M84 250C44 246 28 280 36 312C44 344 72 352 92 330" fill="#B8894A" stroke="#A67C3D" stroke-width="4"/>
    <rect x="24" y="300" width="34" height="48" rx="12" fill="#94A3B8"/>
    <rect x="28" y="344" width="26" height="18" rx="8" fill="url(#bot-metal)"/>

    <path d="M396 250C436 246 452 280 444 312C436 344 408 352 388 330" fill="#B8894A" stroke="#A67C3D" stroke-width="4"/>
    <rect x="422" y="300" width="34" height="48" rx="12" fill="#94A3B8"/>
    <rect x="426" y="344" width="26" height="18" rx="8" fill="url(#bot-metal)"/>

    <!-- Feet -->
    <rect x="176" y="448" width="52" height="24" rx="12" fill="#64748B"/>
    <rect x="252" y="448" width="52" height="24" rx="12" fill="#64748B"/>
  </g>
</svg>
