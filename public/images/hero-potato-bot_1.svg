<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" fill="none" role="img" aria-label="Botato">
  <defs>
    <linearGradient id="potato" x1="70" y1="40" x2="340" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8B887"/>
      <stop offset="1" stop-color="#C98A4B"/>
    </linearGradient>
    <linearGradient id="headset" x1="60" y1="80" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <ellipse cx="210" cy="250" rx="150" ry="180" fill="url(#potato)"/>
  <ellipse cx="150" cy="180" rx="28" ry="18" fill="#F3D2A8" opacity="0.55"/>
  <ellipse cx="270" cy="320" rx="34" ry="20" fill="#A86F35" opacity="0.18"/>
  <ellipse cx="130" cy="300" rx="16" ry="10" fill="#A86F35" opacity="0.16"/>

  <!-- eyes -->
  <circle cx="165" cy="220" r="18" fill="#0F172A"/>
  <circle cx="255" cy="220" r="18" fill="#0F172A"/>
  <circle cx="171" cy="214" r="6" fill="#fff"/>
  <circle cx="261" cy="214" r="6" fill="#fff"/>

  <!-- smile -->
  <path d="M172 278c18 26 58 26 76 0" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>

  <!-- cheeks -->
  <ellipse cx="128" cy="255" rx="16" ry="10" fill="#E58B6A" opacity="0.45"/>
  <ellipse cx="292" cy="255" rx="16" ry="10" fill="#E58B6A" opacity="0.45"/>

  <!-- headset band -->
  <path d="M90 170c20-78 220-78 240 0" stroke="url(#headset)" stroke-width="18" stroke-linecap="round"/>
  <rect x="68" y="155" width="44" height="62" rx="18" fill="url(#headset)"/>
  <rect x="308" y="155" width="44" height="62" rx="18" fill="url(#headset)"/>

  <!-- mic boom -->
  <path d="M330 210c28 24 28 70 8 96" stroke="#4F46E5" stroke-width="10" stroke-linecap="round"/>
  <circle cx="330" cy="318" r="16" fill="#4F46E5"/>
  <circle cx="330" cy="318" r="7" fill="#C7D2FE"/>

  <!-- chat bubble -->
  <rect x="300" y="42" width="96" height="58" rx="18" fill="#4F46E5"/>
  <path d="M318 100l10 22 18-22" fill="#4F46E5"/>
  <circle cx="326" cy="71" r="5" fill="#fff"/>
  <circle cx="348" cy="71" r="5" fill="#fff"/>
  <circle cx="370" cy="71" r="5" fill="#fff"/>
</svg>
