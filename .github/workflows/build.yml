name: CI

on:
  pull_request:
    paths: &paths
      - '.github/workflows/build.yml'
      - '.github/**/*.yml'
      - '.github/**/*.yaml'
      - 'config/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'codeception.yml'
      - 'composer.json'
      - 'composer.lock'
      - 'composer-dependency-analyser.php'
      - 'psalm.xml'
      - '.php-cs-fixer.php'
      - 'rector.php'
      - 'yii'
      - 'yii.bat'
  push:
    branches: ['main']
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STACK_NAME: botato
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  psalm:
    name: Psalm PHP 8.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          coverage: none
          php-version: '8.3'
          tools: composer:v2, cs2pr

      - name: Install Composer dependencies.
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Static analysis.
        run: vendor/bin/psalm --shepherd --stats --output-format=checkstyle --no-cache --php-version=8.3 | cs2pr --graceful-warnings --colorize

  composer-dependency-analyzer:
    name: Composer dependencies PHP 8.3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          coverage: none
          php-version: '8.3'
          tools: composer:v2, cs2pr

      - name: Install Composer dependencies.
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run composer dependency analyzer.
        run: vendor/bin/composer-dependency-analyser --config=composer-dependency-analyser.php

  codeception:
    name: Tests PHP 8.3
    runs-on: ubuntu-latest

    env:
      key: cache-v1
      APP_C3: true
      APP_ENV: test
      APP_DEBUG: false

    steps:
      - name: Checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          coverage: false
          extensions: fileinfo, intl
          ini-values: date.timezone='UTC', register_argc_argv=On
          php-version: '8.3'

      - name: Install Composer dependencies.
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run codeception build.
        run: php vendor/bin/codecept build

      - name: Run tests with codeception with code coverage.
        run: php vendor/bin/codecept run --coverage --coverage-xml --disable-coverage-php

      - name: Upload coverage to Codecov.
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: runtime/tests/_output/coverage.xml

  cs-fix:
    name: Code style
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install PHP.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies.
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHP CS Fixer.
        run: ./vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php

      - name: Run Rector.
        run: ./vendor/bin/rector --output-format=github

      - name: Commit changes.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper '!f() { echo username=x-access-token; echo password=$GITHUB_TOKEN; }; f'
          git add '*.php'
          git diff --staged --quiet || git commit -m "Apply PHP CS Fixer and Rector changes (CI)"
          git push origin "HEAD:${HEAD_REF}"

  deploy:
    name: Deploy to VPS
    needs: [psalm, composer-dependency-analyzer, codeception]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log in to GitHub Container Registry.
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image.
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare production environment files.
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
          PROD_OVERRIDE_ENV_FILE: ${{ secrets.PROD_OVERRIDE_ENV_FILE }}
        run: |
          set -euo pipefail
          if [ -z "${PROD_ENV_FILE}" ]; then
            echo 'Secret PROD_ENV_FILE is not set. Add docker/prod/.env content to repository secrets.'
            exit 1
          fi
          printf '%s\n' "${PROD_ENV_FILE}" > docker/prod/.env
          if [ -n "${PROD_OVERRIDE_ENV_FILE}" ]; then
            printf '%s\n' "${PROD_OVERRIDE_ENV_FILE}" > docker/prod/override.env
          else
            : > docker/prod/override.env
          fi

      - name: Configure SSH.
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          if { [ -z "${VPS_SSH_PRIVATE_KEY_B64:-}" ] && [ -z "${VPS_SSH_PRIVATE_KEY:-}" ]; } \
            || [ -z "${VPS_HOST}" ] || [ -z "${VPS_USER}" ]; then
            echo 'Secrets VPS_HOST, VPS_USER and VPS_SSH_PRIVATE_KEY_B64 (or VPS_SSH_PRIVATE_KEY) are required.'
            exit 1
          fi
          install -m 700 -d ~/.ssh
          if [ -n "${VPS_SSH_PRIVATE_KEY_B64:-}" ]; then
            if ! printf '%s' "${VPS_SSH_PRIVATE_KEY_B64}" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy_key; then
              echo 'Failed to decode VPS_SSH_PRIVATE_KEY_B64. Re-create the secret from botato_deploy (single line, no spaces).'
              exit 1
            fi
          else
            printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/deploy_key; then
            echo 'SSH private key does not look valid (missing BEGIN marker).'
            echo 'Use secret VPS_SSH_PRIVATE_KEY_B64 — see DEPLOY.md.'
            exit 1
          fi
          if grep -q 'ENCRYPTED' ~/.ssh/deploy_key; then
            echo 'SSH key is passphrase-protected. Regenerate without passphrase:'
            echo 'ssh-keygen -t ed25519 -C "github-actions-deploy" -f ~/.ssh/botato_deploy -N ""'
            exit 1
          fi
          if ! ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>~/.ssh/deploy_key.err; then
            if grep -qiE 'passphrase|incorrect passphrase' ~/.ssh/deploy_key.err; then
              echo 'SSH key is passphrase-protected. GitHub Actions cannot enter a password.'
              echo 'Remove passphrase (PowerShell): ssh-keygen -p -f $env:USERPROFILE\.ssh\botato_deploy'
              echo 'Or create a new deploy key without passphrase:'
              echo 'ssh-keygen -t ed25519 -C "github-actions-deploy" -f $env:USERPROFILE\.ssh\botato_deploy -N ""'
              exit 1
            fi
            echo "SSH key file size: $(wc -c < ~/.ssh/deploy_key) bytes"
            echo "SSH key header: $(head -n1 ~/.ssh/deploy_key)"
            echo 'ssh-keygen error:'
            cat ~/.ssh/deploy_key.err
            echo 'Invalid SSH private key in GitHub Secrets.'
            echo 'Recreate VPS_SSH_PRIVATE_KEY_B64 (PowerShell):'
            echo '[Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\\.ssh\\botato_deploy"))'
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          {
            printf '%s\n' \
              'Host docker-web' \
              "  HostName ${VPS_HOST}" \
              "  User ${VPS_USER}" \
              '  IdentityFile ~/.ssh/deploy_key' \
              '  IdentitiesOnly yes' \
              '  PreferredAuthentications publickey' \
              '  StrictHostKeyChecking yes' \
              '  BatchMode yes' \
              '' \
              "Host ${VPS_HOST}" \
              "  User ${VPS_USER}" \
              '  IdentityFile ~/.ssh/deploy_key' \
              '  IdentitiesOnly yes' \
              '  PreferredAuthentications publickey' \
              '  StrictHostKeyChecking yes' \
              '  BatchMode yes'
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" 'echo "SSH connection OK"'
          echo "VPS_USER=${VPS_USER}" >> "${GITHUB_ENV}"
          echo "VPS_HOST=${VPS_HOST}" >> "${GITHUB_ENV}"

      - name: Log in to registry on VPS.
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          token="${GHCR_PULL_TOKEN:-${GITHUB_TOKEN}}"
          echo "${token}" | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u ${GITHUB_ACTOR} --password-stdin"

      - name: Sync production environment files to VPS.
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            'install -d -m 700 /opt/botato/docker/prod'
          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            docker/prod/.env "${VPS_USER}@${VPS_HOST}:/opt/botato/docker/prod/.env"
          if [ -f docker/prod/override.env ]; then
            scp -i ~/.ssh/deploy_key \
              -o IdentitiesOnly=yes \
              -o PreferredAuthentications=publickey \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes \
              docker/prod/override.env "${VPS_USER}@${VPS_HOST}:/opt/botato/docker/prod/override.env"
          fi

      - name: Deploy stack to Docker Swarm.
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          export IMAGE="${{ env.IMAGE }}"
          export STACK_NAME="${{ env.STACK_NAME }}"
          export PROD_HOST="${PROD_HOST}"
          docker context create prod --docker "host=ssh://${VPS_USER}@${VPS_HOST}"
          docker --context prod stack deploy \
            --prune \
            --detach=false \
            --with-registry-auth \
            -c docker/compose.yml \
            -c docker/prod/compose.yml \
            "${STACK_NAME}"

      - name: Run database migrations.
        env:
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ github.sha }}
          STACK_NAME: ${{ env.STACK_NAME }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "docker run --rm \
              --network ${STACK_NAME}_internal \
              --env-file /opt/botato/docker/prod/.env \
              ${IMAGE}:${IMAGE_TAG} php ./yii migrate/up --interactive=0"
