name: build

on:
  pull_request:
    paths: &paths
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'codeception.yml'
      - 'composer.json'
      - 'yii'
      - 'yii.bat'
  push:
    branches: ['main']
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeception:
    name: PHP 8.3

    env:
      key: cache-v1
      APP_C3: true
      APP_ENV: test
      APP_DEBUG: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install PHP with extensions.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          coverage: false
          extensions: fileinfo, intl
          ini-values: date.timezone='UTC', register_argc_argv=On
          php-version: '8.3'

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run codeception build.
        run: php vendor/bin/codecept build

      - name: Run tests with codeception with code coverage.
        run: php vendor/bin/codecept run --coverage --coverage-xml --disable-coverage-php

      - name: Upload coverage to Codecov.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: runtime/tests/_output/coverage.xml
